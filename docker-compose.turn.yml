services:
  coturn:
    image: coturn/coturn:4.6.3
    profiles: [turn]
    restart: unless-stopped
    command:
      - -n
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${G1VIEWER_TURN_SHARED_SECRET:-${OPENDESK_TURN_SHARED_SECRET:?Generate G1VIEWER_TURN_SHARED_SECRET in .env before starting the TURN profile}}
      - --realm=${G1VIEWER_TURN_REALM:-${OPENDESK_TURN_REALM:?Set G1VIEWER_TURN_REALM in .env}}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${G1VIEWER_TURN_EXTERNAL_IP:-${OPENDESK_TURN_EXTERNAL_IP:?Set G1VIEWER_TURN_EXTERNAL_IP in .env}}
      - --no-multicast-peers
      - --no-loopback-peers
      - --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/tcp"
      - "49160-49200:49160-49200/udp"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
