name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build, audit, and Go verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build desktop bundles
        run: npm run build
      - name: Audit all npm dependencies
        run: npm audit --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Signaling tests with race detector
        working-directory: services/signaling
        run: go test -race -cover ./...
      - name: Go vet
        working-directory: services/signaling
        run: go vet ./...


  e2e:
    name: Two-client end-to-end (real signaling broker, headless Chromium)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Install Chrome for the headless two-client test
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Run two-client end-to-end test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e

  packages:
    name: Unsigned ${{ matrix.platform }} package
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux AppImage/deb
            os: ubuntu-latest
          - platform: Windows NSIS
            os: windows-latest
          - platform: macOS DMG
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Build unsigned installer targets
        run: npm run dist
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendesk-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  visual:
    name: Reference-sized dashboard screenshot
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Capture renderer at 1536×1024
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node e2e/visual/capture.mjs
      - name: Upload visual validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opendesk-visual-validation
          path: artifacts/visual-validation/
          if-no-files-found: warn
          retention-days: 14
