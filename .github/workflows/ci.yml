name: CI

# Keep only the newest run per ref; a newer main commit cancels obsolete builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, unit tests, build, audit, and Go verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build desktop bundles
        run: npm run build
      - name: Audit all npm dependencies
        run: npm audit --audit-level=high
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Signaling tests with race detector
        working-directory: services/signaling
        run: go test -race -cover ./...
      - name: Go vet
        working-directory: services/signaling
        run: go vet ./...


  e2e:
    name: Two-client end-to-end (real signaling broker, headless Chromium)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Install Chrome for the headless two-client test
        uses: browser-actions/setup-chrome@v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - name: Run two-client end-to-end test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e

  wan-smoke:
    name: Deployed WAN signaling and WebRTC smoke (optional)
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && vars.G1VIEWER_WAN_SIGNALING_URL != ''
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - uses: browser-actions/setup-chrome@v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - name: Test deployed signaling, WebRTC video, ICE path, file transfer, and input permissions
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          G1VIEWER_WAN_SIGNALING_URL: ${{ vars.G1VIEWER_WAN_SIGNALING_URL }}
          E2E_ICE_TRANSPORT_POLICY: all
        run: npm run test:e2e

  turn-relay:
    name: Deployed TURN relay-only connection smoke (optional)
    if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && vars.G1VIEWER_WAN_SIGNALING_URL != '' && vars.G1VIEWER_WAN_TURN_TEST == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - uses: browser-actions/setup-chrome@v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - name: Force relay-only ICE and verify selected TURN candidates
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          G1VIEWER_WAN_SIGNALING_URL: ${{ vars.G1VIEWER_WAN_SIGNALING_URL }}
          E2E_ICE_TRANSPORT_POLICY: relay
        run: npm run test:e2e

  packages:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64 (.exe)
            os: windows-latest
            build_cmd: npm run dist:win:x64
            file: release/g1viewer_x64.exe
            filename: g1viewer_x64.exe
            artifact_name: g1viewer-windows-x64
          - id: windows-arm64
            name: Windows ARM64 (.exe)
            os: windows-latest
            build_cmd: npm run dist:win:arm64
            file: release/g1viewer_arm64.exe
            filename: g1viewer_arm64.exe
            artifact_name: g1viewer-windows-arm64
          - id: macos-x64
            name: macOS Intel x64 (.dmg)
            os: macos-latest
            build_cmd: npm run dist:mac:x64
            file: release/g1viewer_x64.dmg
            filename: g1viewer_x64.dmg
            artifact_name: g1viewer-macos-x64
          - id: macos-arm64
            name: macOS Apple Silicon ARM64 (.dmg)
            os: macos-latest
            build_cmd: npm run dist:mac:arm64
            file: release/g1viewer_arm64.dmg
            filename: g1viewer_arm64.dmg
            artifact_name: g1viewer-macos-arm64
          - id: linux-x64-deb
            name: Linux x64 Debian (.deb)
            os: ubuntu-24.04
            build_cmd: npm run dist:linux:deb
            file: release/g1viewer_x64.deb
            filename: g1viewer_x64.deb
            artifact_name: g1viewer-linux-x64-deb
          - id: linux-x64-appimage
            name: Linux x64 AppImage (.AppImage)
            os: ubuntu-24.04
            build_cmd: npm run dist:linux:appimage
            file: release/g1viewer_x64.AppImage
            filename: g1viewer_x64.AppImage
            artifact_name: g1viewer-linux-x64-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Generate desktop branding icons and packaging assets
        run: npm run icons
      - name: Build macOS ${{ matrix.name }} (sign and notarize when credentials are configured)
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            if [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_TEAM_ID" ]; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
              chmod 600 "$key_path"
              export APPLE_API_KEY="$key_path"
              echo "Apple signing and notarization credentials found."
            else
              unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
              echo "::notice::Notarization credentials are incomplete; the signed macOS build will not be notarized."
            fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice::Apple signing credentials are not configured; producing an unsigned macOS build."
          fi
          ${{ matrix.build_cmd }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build ${{ matrix.name }} (non-macOS)
        if: ${{ !startsWith(matrix.id, 'macos-') }}
        run: ${{ matrix.build_cmd }}
      - name: Normalize filename and clean build side-effects
        shell: bash
        run: |
          rm -f release/*.blockmap* release/*.yml* release/*.yaml*
          if [ -f release/g1viewer_x86_64.AppImage ]; then
            mv release/g1viewer_x86_64.AppImage release/g1viewer_x64.AppImage
          fi
          if [ -f release/g1viewer_amd64.deb ]; then
            mv release/g1viewer_amd64.deb release/g1viewer_x64.deb
          fi
          echo "=== Deliverables in release/ ==="
          ls -la release/
      - name: Validate deliverable format and integrity
        run: node scripts/validate-release-assets.mjs --target ${{ matrix.id }} --dir release
      - name: Upload standalone ${{ matrix.filename }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.file }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  verify-packages:
    name: Verify all 6 standalone deliverables
    needs: packages
    # CI and tag-based releases must never upload the same release assets concurrently.
    concurrency:
      group: g1viewer-release-assets-${{ github.repository }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create deliverables directory
        run: mkdir -p release-assets
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: g1viewer_*
          path: release-assets
          merge-multiple: true
      - name: Run automated deliverables validation
        run: |
          echo "=== Deliverables downloaded from CI artifacts ==="
          ls -la release-assets/
          node scripts/validate-release-assets.mjs --all release-assets/
      - name: Publish or update continuous release on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "Updating release assets for $TAG on main push..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating standalone binaries..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new release $TAG with standalone uncompressed binaries..."
            gh release create "$TAG" release-assets/* \
              --title "G1Viewer $TAG" \
              --generate-notes
          fi
      - name: Generate download summary for GitHub Actions
        run: |
          echo "## 🚀 Direct Download Links (Uncompressed Installers)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
          echo "> **Do NOT download from the Actions \"Artifacts\" table below.** GitHub's web interface packages all artifact downloads into \`.zip\` archives." >> $GITHUB_STEP_SUMMARY
          echo "> To download the **direct native application/installer without any \`.zip\` extraction**, click the official direct links below:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Installer Format | Direct 1-Click Download |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | 64-bit (\`x64\`) | NSIS Setup (\`.exe\`) | [**g1viewer_x64.exe**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/g1viewer_x64.exe) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | ARM64 | NSIS Setup (\`.exe\`) | [**g1viewer_arm64.exe**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/g1viewer_arm64.exe) |" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | Apple Silicon (\`arm64\`) | Disk Image (\`.dmg\`) | [**g1viewer_arm64.dmg**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/g1viewer_arm64.dmg) |" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | Intel (\`x64\`) | Disk Image (\`.dmg\`) | [**g1viewer_x64.dmg**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/g1viewer_x64.dmg) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linux** | 64-bit (\`x64\`) | Standalone AppImage (\`.AppImage\`) | [**g1viewer_x64.AppImage**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/g1viewer_x64.AppImage) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Linux** | 64-bit (\`x64\`) | Debian / Ubuntu (\`.deb\`) | [**g1viewer_x64.deb**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/g1viewer_x64.deb) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checksums: [**SHA256SUMS.txt**](https://github.com/urstrulyg1/G1Viewer/releases/latest/download/SHA256SUMS.txt)" >> $GITHUB_STEP_SUMMARY

  visual:
    name: Reference-sized dashboard screenshot
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - name: Capture renderer at 1536×1024
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node e2e/visual/capture.mjs
      - name: Upload visual validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g1viewer-visual-validation
          path: artifacts/visual-validation/
          if-no-files-found: warn
          retention-days: 14
