name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build desktop bundles
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  signaling:
    name: Go health service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Test
        working-directory: services/signaling
        run: go test -race -cover ./...
      - name: Vet
        working-directory: services/signaling
        run: go vet ./...
