name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build, audit, and Go verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build desktop bundles
        run: npm run build
      - name: Audit all npm dependencies
        run: npm audit --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Signaling tests with race detector
        working-directory: services/signaling
        run: go test -race -cover ./...
      - name: Go vet
        working-directory: services/signaling
        run: go vet ./...


  e2e:
    name: Two-client end-to-end (real signaling broker, headless Chromium)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: services/signaling/go.mod
      - name: Install Chrome for the headless two-client test
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Run two-client end-to-end test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e

  packages:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64 (.exe)
            os: windows-latest
            build_cmd: npm run dist:win:x64
            file: release/g1viewer_x64.exe
            filename: g1viewer_x64.exe
            artifact_name: g1viewer-windows-x64
          - id: windows-arm64
            name: Windows ARM64 (.exe)
            os: windows-latest
            build_cmd: npm run dist:win:arm64
            file: release/g1viewer_arm64.exe
            filename: g1viewer_arm64.exe
            artifact_name: g1viewer-windows-arm64
          - id: macos-x64
            name: macOS Intel x64 (.dmg)
            os: macos-latest
            build_cmd: npm run dist:mac:x64
            file: release/g1viewer_x64.dmg
            filename: g1viewer_x64.dmg
            artifact_name: g1viewer-macos-x64
          - id: macos-arm64
            name: macOS Apple Silicon ARM64 (.dmg)
            os: macos-latest
            build_cmd: npm run dist:mac:arm64
            file: release/g1viewer_arm64.dmg
            filename: g1viewer_arm64.dmg
            artifact_name: g1viewer-macos-arm64
          - id: linux-x64-deb
            name: Linux x64 Debian (.deb)
            os: ubuntu-latest
            build_cmd: npm run dist:linux:deb
            file: release/g1viewer_x64.deb
            filename: g1viewer_x64.deb
            artifact_name: g1viewer-linux-x64-deb
          - id: linux-x64-appimage
            name: Linux x64 AppImage (.AppImage)
            os: ubuntu-latest
            build_cmd: npm run dist:linux:appimage
            file: release/g1viewer_x64.AppImage
            filename: g1viewer_x64.AppImage
            artifact_name: g1viewer-linux-x64-appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Generate desktop branding icons and packaging assets
        run: npm run icons
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build_cmd }}
      - name: Normalize filename and clean build side-effects
        shell: bash
        run: |
          rm -f release/*.blockmap* release/*.yml* release/*.yaml*
          if [ -f release/g1viewer_x86_64.AppImage ]; then
            mv release/g1viewer_x86_64.AppImage release/g1viewer_x64.AppImage
          fi
          if [ -f release/g1viewer_amd64.deb ]; then
            mv release/g1viewer_amd64.deb release/g1viewer_x64.deb
          fi
          echo "=== Deliverables in release/ ==="
          ls -la release/
      - name: Validate deliverable format and integrity
        run: node scripts/validate-release-assets.mjs --target ${{ matrix.id }} --dir release
      - name: Upload standalone ${{ matrix.filename }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 14

  verify-packages:
    name: Verify all 6 standalone deliverables
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create deliverables directory
        run: mkdir -p release-assets
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: g1viewer-*
          path: release-assets
          merge-multiple: true
      - name: Run automated deliverables validation
        run: |
          echo "=== Deliverables downloaded from CI artifacts ==="
          ls -la release-assets/
          node scripts/validate-release-assets.mjs --all release-assets/

  visual:
    name: Reference-sized dashboard screenshot
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Capture renderer at 1536×1024
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node e2e/visual/capture.mjs
      - name: Upload visual validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1viewer-visual-validation
          path: artifacts/visual-validation/
          if-no-files-found: warn
          retention-days: 14
