<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1v-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#09101D"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="g1v-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="g1v-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g1v-ambient" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g1v-tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="22" fill="url(#g1v-ambient)"/>
  
  <!-- Outer Display / Connection Orbit -->
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M 12 32 A 20 20 0 0 1 52 32" fill="none" stroke="url(#g1v-glow)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- G1 Viewer Core Brand Glyph -->
  <!-- Outer loop -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Interconnected G1 Remote Access Path -->
  <path d="M22 25 C25 18 36 17.5 41.5 23 C46 27.5 45 34 40.5 37.5 L31 45.5 C27.5 48.5 22 47.5 20.5 43.5 C19.5 41 20.5 38 23 36 L29 31" 
        fill="none" 
        stroke="url(#g1v-accent)" 
        stroke-width="3.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- High-speed Direct Display Beam (1) -->
  <path d="M35 21 C41.5 21 45.5 27 43 32.5 C41 36 36.5 37.5 33.5 40" 
        fill="none" 
        stroke="#E0F2FE" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Active Connection Beacon Node -->
  <circle cx="33" cy="21" r="2.8" fill="#38BDF8"/>
  <circle cx="33" cy="21" r="1.5" fill="#FFFFFF"/>
</svg>
